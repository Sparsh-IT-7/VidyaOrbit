<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Orbital Arc Behind Emblem -->
  <ellipse
    cx="62"
    cy="62"
    rx="48"
    ry="20"
    transform="rotate(-24 62 62)"
    stroke="#D4AF37"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <!-- Orbital Electron / Star Node -->
  <circle cx="104" cy="40" r="6.5" fill="#D4AF37" />
  <circle cx="20" cy="83" r="5" fill="#B59024" />

  <!-- Central Academic Shield / Globe Core -->
  <circle cx="62" cy="60" r="30" fill="#0F172A" />
  <circle cx="62" cy="60" r="27" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.85" />

  <!-- Graduation Mortarboard Cap Inside Core -->
  <path
    d="M62 41L39 51.5L62 62L85 51.5L62 41Z"
    fill="#D4AF37"
  />
  <path
    d="M48 56.5V66.5C48 70.5 54.5 74 62 74C69.5 74 76 70.5 76 66.5V56.5L62 63L48 56.5Z"
    fill="#FFFFFF"
  />
  <!-- Cap Tassel -->
  <path
    d="M82 53V65"
    stroke="#D4AF37"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <circle cx="82" cy="66.5" r="2.5" fill="#D4AF37" />

  <!-- Foreground Orbital Ring Sweep -->
  <path
    d="M21 79C29 90 54 89 79 77C96 69 108 56 108 46"
    stroke="#D4AF37"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- VidyaOrbit Wordmark -->
  <text
    x="126"
    y="73"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="-1.2"
    fill="#0F172A"
  >
    Vidya<tspan fill="#D4AF37">Orbit</tspan>
  </text>

  <!-- Subtle Gold Accent Underline & Subtitle -->
  <rect x="128" y="86" width="64" height="3.5" rx="1.75" fill="#D4AF37" />
  <text
    x="202"
    y="91"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="12.5"
    font-weight="700"
    letter-spacing="2.6"
    fill="#64748B"
